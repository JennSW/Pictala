<svg width="680" height="524" viewBox="0 0 680 524" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Outing grouping and checklist-to-photo matching</title>
<desc>Checklists sharing the same date and eBird Location ID are grouped into one outing. A photo is checked against that outing's time and place window; if it matches, it continues to species-level matching, otherwise it becomes part of a checklist-less photo cluster grouped by date and GPS proximity.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t { font-size: 14px; fill: #1f2937; }
  .ts { font-size: 12px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 500; fill: #1f2937; }
  .box rect { fill: #f9fafb; stroke: #9ca3af; }
  .c-green rect { fill: #dcfce7; stroke: #16a34a; }
  .c-green .th, .c-green .t { fill: #166534; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; }
  .c-amber .th, .c-amber .t { fill: #92400e; }
  .arr { stroke: #4b5563; stroke-width: 1.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="524" fill="#ffffff"/>

<g class="box">
<rect x="210" y="40" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Checklists</text>
<text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">same date + eBird Location ID</text>
</g>

<line x1="340" y1="96" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>

<g class="box">
<rect x="210" y="140" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="158" text-anchor="middle" dominant-baseline="central">Grouped outing</text>
<text class="ts" x="340" y="176" text-anchor="middle" dominant-baseline="central">combined species list</text>
</g>

<line x1="340" y1="196" x2="340" y2="240" class="arr" marker-end="url(#arrow)"/>

<g class="box">
<rect x="190" y="240" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="258" text-anchor="middle" dominant-baseline="central">Photo matches outing?</text>
<text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central">time window, or same-day + GPS</text>
</g>

<path d="M340,296 L170,360" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M340,296 L510,360" class="arr" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="230" y="320" text-anchor="middle">Yes</text>
<text class="ts" x="450" y="320" text-anchor="middle">No</text>

<g class="c-green">
<rect x="70" y="360" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="382" text-anchor="middle" dominant-baseline="central">Matched to outing</text>
</g>

<g class="c-amber">
<rect x="410" y="360" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="382" text-anchor="middle" dominant-baseline="central">No checklist match</text>
</g>

<line x1="510" y1="404" x2="510" y2="448" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="400" y="448" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="466" text-anchor="middle" dominant-baseline="central">Photo-only cluster</text>
<text class="ts" x="510" y="484" text-anchor="middle" dominant-baseline="central">grouped by date + GPS</text>
</g>
</svg>
