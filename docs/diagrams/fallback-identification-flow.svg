<svg width="680" height="336" viewBox="0 0 680 336" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fallback identification for unmatched or checklist-less photos</title>
<desc>An unmatched or checklist-less photo can be run through a broader, unconstrained Claude guess, then checked against eBird's taxonomy. If identified, approving it labels the photo and shows a link to add it to the real eBird checklist manually. If not identifiable, the photo is flagged as non-bird or unidentifiable.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t { font-size: 14px; fill: #1f2937; }
  .ts { font-size: 12px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 500; fill: #1f2937; }
  .box rect { fill: #f9fafb; stroke: #9ca3af; }
  .c-green rect { fill: #dcfce7; stroke: #16a34a; }
  .c-green .th, .c-green .t { fill: #166534; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; }
  .c-amber .th, .c-amber .t { fill: #92400e; }
  .arr { stroke: #4b5563; stroke-width: 1.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="336" fill="#ffffff"/>

<g class="c-amber">
<rect x="190" y="40" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Unmatched photo</text>
<text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">no confirmed eBird species</text>
</g>

<line x1="340" y1="96" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>

<g class="box">
<rect x="170" y="140" width="340" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="158" text-anchor="middle" dominant-baseline="central">Suggest species (fallback)</text>
<text class="ts" x="340" y="176" text-anchor="middle" dominant-baseline="central">Claude + eBird taxonomy lookup</text>
</g>

<path d="M340,196 L175,260" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M340,196 L495,260" class="arr" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="215" y="230" text-anchor="middle">Identified</text>
<text class="ts" x="460" y="230" text-anchor="middle">Not identifiable</text>

<g class="c-green">
<rect x="60" y="260" width="230" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="175" y="278" text-anchor="middle" dominant-baseline="central">Approved</text>
<text class="ts" x="175" y="296" text-anchor="middle" dominant-baseline="central">labeled + eBird link shown</text>
</g>

<g class="c-amber">
<rect x="380" y="260" width="230" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="278" text-anchor="middle" dominant-baseline="central">Flagged</text>
<text class="ts" x="495" y="296" text-anchor="middle" dominant-baseline="central">non-bird or unidentifiable</text>
</g>
</svg>
