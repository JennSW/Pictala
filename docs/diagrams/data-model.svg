<svg width="1070" height="700" viewBox="0 0 1070 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pictala data model</title>
<desc>Six SQLite tables. Checklist and Observation come from eBird; Photo comes from Flickr. Match is the central join table linking a Photo to a Checklist and optionally an Observation, recording how and how confidently that link was made. AiSuggestionLog records every AI species suggestion and its outcome (accepted, corrected, or rejected) independently of Match, so a rejected or edited suggestion is never lost even though the Match row itself only ever holds the current state. SyncLog is a standalone table with no foreign keys, used only to enforce the daily manual-sync limit.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t { font-size: 12.5px; fill: #1f2937; }
  .tm { font-size: 11.5px; fill: #6b7280; }
  .ts { font-size: 12px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2937; }
  .group-label { font-size: 12px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.04em; }
  .box rect.card { fill: #f9fafb; stroke: #9ca3af; }
  .box rect.head { fill: #f3f4f6; stroke: none; }
  .c-green rect.card { fill: #f0fdf4; stroke: #16a34a; }
  .c-green rect.head { fill: #dcfce7; stroke: none; }
  .c-green .th { fill: #166534; }
  .arr { stroke: #4b5563; stroke-width: 1.5; fill: none; }
  .arr-dashed { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  .note { font-size: 11.5px; fill: #6b7280; font-style: italic; }
  .lbl-bg { fill: #ffffff; opacity: 0.9; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1070" height="700" fill="#ffffff"/>
<text class="th" x="30" y="30" style="font-size:16px">Pictala — data model</text>

<text class="group-label" x="30" y="50">EBIRD IMPORT</text>
<text class="group-label" x="780" y="50">FLICKR SYNC</text>

<!-- ===================== Checklist ===================== -->
<g class="box">
<rect class="card" x="30" y="60" width="230" height="162" rx="8"/>
<rect class="head" x="30" y="60" width="230" height="28" rx="8"/>
<rect x="30" y="76" width="230" height="12" fill="#f3f4f6"/>
<text class="th" x="42" y="74" dominant-baseline="central">Checklist</text>
<text class="t"  x="42" y="106">id — PK, submission_id</text>
<text class="t"  x="42" y="124">location_name, location_id</text>
<text class="t"  x="42" y="142">date, start_time</text>
<text class="t"  x="42" y="160">duration_minutes</text>
<text class="t"  x="42" y="178">latitude, longitude</text>
<text class="tm" x="42" y="196">outing_reviewed_at (nullable)</text>
<text class="tm" x="42" y="214">(time, duration, coordinates nullable)</text>
</g>

<!-- ===================== Observation ===================== -->
<g class="box">
<rect class="card" x="30" y="260" width="230" height="90" rx="8"/>
<rect class="head" x="30" y="260" width="230" height="28" rx="8"/>
<rect x="30" y="276" width="230" height="12" fill="#f3f4f6"/>
<text class="th" x="42" y="274" dominant-baseline="central">Observation</text>
<text class="t"  x="42" y="306">id — PK</text>
<text class="t"  x="42" y="324">checklist_id — FK</text>
<text class="t"  x="42" y="342">common_name, scientific_name</text>
</g>

<!-- ===================== SyncLog ===================== -->
<g class="box">
<rect class="card" x="30" y="470" width="200" height="72" rx="8"/>
<rect class="head" x="30" y="470" width="200" height="28" rx="8"/>
<rect x="30" y="486" width="200" height="12" fill="#f3f4f6"/>
<text class="th" x="42" y="484" dominant-baseline="central">SyncLog</text>
<text class="t"  x="42" y="516">id — PK</text>
<text class="t"  x="42" y="534">triggered_at</text>
</g>
<text class="note" x="30" y="564">Standalone — no foreign keys.</text>
<text class="note" x="30" y="580">Just enforces the daily manual-sync limit.</text>

<!-- ===================== Photo ===================== -->
<g class="box">
<rect class="card" x="780" y="60" width="262" height="126" rx="8"/>
<rect class="head" x="780" y="60" width="262" height="28" rx="8"/>
<rect x="780" y="76" width="262" height="12" fill="#f3f4f6"/>
<text class="th" x="792" y="74" dominant-baseline="central">Photo</text>
<text class="t"  x="792" y="106">id — PK</text>
<text class="t"  x="792" y="124">flickr_id, title, tags</text>
<text class="t"  x="792" y="142">date_taken, utc_offset</text>
<text class="tm" x="792" y="160">duplicate_group_key (nullable)</text>
<text class="tm" x="792" y="178">latitude, longitude, url_medium (nullable)</text>
</g>

<!-- ===================== AiSuggestionLog ===================== -->
<g class="c-green">
<rect class="card" x="780" y="280" width="260" height="144" rx="8"/>
<rect class="head" x="780" y="280" width="260" height="28" rx="8"/>
<rect x="780" y="296" width="260" height="12" fill="#dcfce7"/>
<text class="th" x="792" y="294" dominant-baseline="central">AiSuggestionLog</text>
<text class="t"  x="792" y="326">id — PK</text>
<text class="t"  x="792" y="344">photo_id — FK</text>
<text class="t"  x="792" y="362">checklist_id — FK (nullable)</text>
<text class="t"  x="792" y="380">kind — constrained | unconstrained</text>
<text class="t"  x="792" y="398">outcome — accepted | corrected | rejected</text>
<text class="tm" x="792" y="416">suggested/final_common_name, confidence</text>
</g>
<text class="note" x="780" y="442">Added 2026-09-03. No FK to Match —</text>
<text class="note" x="780" y="458">Match only ever holds the current</text>
<text class="note" x="780" y="474">state, so a rejected/edited suggestion</text>
<text class="note" x="780" y="490">would otherwise leave no trace.</text>

<!-- ===================== Match ===================== -->
<g class="box">
<rect class="card" x="330" y="440" width="380" height="180" rx="8"/>
<rect class="head" x="330" y="440" width="380" height="28" rx="8"/>
<rect x="330" y="456" width="380" height="12" fill="#f3f4f6"/>
<text class="th" x="342" y="454" dominant-baseline="central">Match</text>
<text class="t"  x="342" y="486">id — PK</text>
<text class="t"  x="342" y="504">checklist_id — FK (nullable)</text>
<text class="t"  x="342" y="522">photo_id — FK</text>
<text class="t"  x="342" y="540">observation_id — FK (nullable)</text>
<text class="t"  x="342" y="558">method, confidence</text>
<text class="t"  x="342" y="576">fallback_common_name / _scientific_name / _species_code</text>
<text class="t"  x="342" y="594">note, reviewed_at (nullable), created_at</text>
<text class="tm" x="342" y="612">the current-state link — one row per photo</text>
</g>

<!-- ===================== connectors ===================== -->

<!-- Checklist -> Observation -->
<line x1="145" y1="222" x2="145" y2="260" class="arr" marker-end="url(#arrow)"/>
<rect class="lbl-bg" x="150" y="233" width="52" height="16"/>
<text class="ts" x="153" y="245">1 → *</text>

<!-- Checklist -> Match (lands top-left of Match) -->
<path d="M258,152 L400,440" class="arr" marker-end="url(#arrow)"/>
<rect class="lbl-bg" x="262" y="292" width="150" height="16"/>
<text class="ts" x="266" y="304">checklist_id (nullable)</text>

<!-- Observation -> Match (lands top-center-left of Match) -->
<path d="M258,308 L470,440" class="arr" marker-end="url(#arrow)"/>
<rect class="lbl-bg" x="300" y="372" width="168" height="16"/>
<text class="ts" x="304" y="384">observation_id (nullable)</text>

<!-- Photo -> Match: leaves from Photo's LEFT edge so it never crosses the
     AiSuggestionLog column below Photo; lands top-right of Match -->
<path d="M780,130 L600,440" class="arr" marker-end="url(#arrow)"/>
<rect class="lbl-bg" x="672" y="272" width="66" height="16"/>
<text class="ts" x="676" y="284">photo_id</text>

<!-- Photo -> AiSuggestionLog (short, same column, no crossing) -->
<line x1="900" y1="186" x2="900" y2="280" class="arr" marker-end="url(#arrow)"/>
<rect class="lbl-bg" x="905" y="225" width="66" height="16"/>
<text class="ts" x="908" y="237">photo_id</text>

<!-- Checklist -> AiSuggestionLog (dashed, independent of Match; arcs
     above Photo and Match, lands in AiSuggestionLog's header band so it
     never touches a field row) -->
<path d="M260,92 C 480,112 650,190 780,300" class="arr-dashed" marker-end="url(#arrow-g)"/>
<rect class="lbl-bg" x="330" y="128" width="330" height="16"/>
<text class="ts" x="334" y="140" fill="#9ca3af">checklist_id (nullable) — logged directly, bypasses Match</text>

<text class="note" x="30" y="680">Key columns only. Every column, including created_at on AiSuggestionLog, is in backend/app/models.py.</text>
</svg>
